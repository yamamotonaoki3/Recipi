[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
tauri-plugin-stronghold = "2.3.2"
# tauri-plugin-stronghold のパスワード導出（argon2 ハッシュ）に使う。
# クレート名は "rust-argon2" だが、Rust コードからは `argon2::...` として使う。
rust-argon2 = "3.0.0"

# tauri-plugin-stronghold の依存先 `scrypt` は、デバッグビルドの最適化無しだと
# 極端に遅くなる既知の問題があるため、公式ドキュメント推奨のとおり
# デバッグビルドでも scrypt だけ最適化する。
[profile.dev.package.scrypt]
opt-level = 3

# Maestro E2E フロー（Web / Chromium 向け）: 新規登録 → 自動ログイン確認 →
# ログアウト → 再ログイン（Issue #36）。
#
# appId の代わりに url を指定すると、Maestro が管理下の Chromium で開く
# （ベータ機能。docs.maestro.dev「Web Browsers」）。
# CI（.github/workflows/e2e.yml）では `expo export -p web` の静的出力を
# ローカルサーバーで配信し、そのオリジンを url に渡す。
#
# テストデータの規約は signup-login-logout.yaml と同じ（@example.com、
# e2euser_ プレフィックス）。Android フローと同じ DB を使い回さないよう、
# メールアドレスは別の連番にしてある。
#
# 【既知の制約】CI 上で実行すると、tapOn 直後に inputText すると別の欄
# （直前にフォーカスしていた欄）へ文字が入ってしまうことがあった
# （スクリーンショットで確認: 複数欄の入力がメールアドレス欄へ連結されて
# いた）。waitForAnimationToEnd・eraseText を挟んでも改善しなかった
# （tapOn はDOM上は成功するが、Maestro 側が実際に入力対象としている
# 要素が前の欄のままずれている可能性が高い。Maestro Web はベータ機能で、
# tapOn/inputText の内部的な要素認識に既知の不具合が報告されている）。
# Android 版でも同系統の問題が特定の欄間（秘密の質問→答え）で再現性
# 100% で起きたため、各欄で tapOn を連続 2 回行い、UI 階層を再取得させて
# から実際にフォーカスを移す（Maestro のタップ取りこぼしに対する定番の
# 回避策）。あわせて eraseText で入力経路をウォームアップしてから
# inputText する（対象欄は元々空文字なので、通常は入力値に影響しない）。
url: "${E2E_WEB_BASE_URL}"
---
- launchApp
# 起動後は splash → 未ログインなのでログイン画面に着地する。
# そこから「新規登録」リンクでサインアップ画面へ移動する。
- tapOn: "新規登録"
- tapOn:
    id: "signup-email"
- tapOn:
    id: "signup-email"
- eraseText: 1
- inputText: "e2euser_002@example.com"
- tapOn:
    id: "signup-password"
- tapOn:
    id: "signup-password"
- eraseText: 1
- inputText: "TestPass123!"
- tapOn:
    id: "signup-password-confirm"
- tapOn:
    id: "signup-password-confirm"
- eraseText: 1
- inputText: "TestPass123!"
- tapOn:
    id: "signup-display-name"
- tapOn:
    id: "signup-display-name"
- eraseText: 1
- inputText: "E2EUser B"
- tapOn:
    id: "signup-security-question"
- tapOn:
    id: "signup-security-question"
- eraseText: 1
- inputText: "好きな食べ物は？"
- tapOn:
    id: "signup-security-answer"
- tapOn:
    id: "signup-security-answer"
- eraseText: 1
- inputText: "ラーメン"
- tapOn:
    id: "signup-submit"

- extendedWaitUntil:
    visible: "ようこそ、E2EUser B さん"
    timeout: 15000

- tapOn:
    id: "home-logout"

- assertVisible:
    id: "login-email"

- tapOn:
    id: "login-email"
- tapOn:
    id: "login-email"
- eraseText: 1
- inputText: "e2euser_002@example.com"
- tapOn:
    id: "login-password"
- tapOn:
    id: "login-password"
- eraseText: 1
- inputText: "TestPass123!"
- tapOn:
    id: "login-submit"

- extendedWaitUntil:
    visible: "ようこそ、E2EUser B さん"
    timeout: 15000

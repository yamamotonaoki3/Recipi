# Maestro E2E フロー（Android エミュレータ向け）: 新規登録 → 自動ログイン確認 →
# ログアウト → 再ログイン（Issue #36）。
#
# 対象アプリは com.recipi.app（app.json の android.package）。
# CI（.github/workflows/e2e.yml）では reactivecircus/android-emulator-runner で
# 起動したエミュレータに、expo prebuild + gradle でビルドしたデバッグ APK を
# インストールしてから実行する。
#
# テストデータはグローバル CLAUDE.md の規約に従い、実在しないメールアドレス
# （@example.com）＋ e2euser_ プレフィックスを使う。CI では postgres コンテナを
# 毎回作り直すため固定値で問題ない。
#
# 【既知の制約】tapOn 直後に inputText すると、まれに直前の欄へ文字が
# 連結されることがある（デバッグスクリーンショットで確認: 「秘密の質問」
# 欄に質問文と答えの両方が入り、「秘密の質問の答え」欄が空になっていた）。
# Web 版ほど頻発しないが同じ系統の問題のため、各 tapOn の直後に
# eraseText を1回挟み、その欄に対して実際にキーボードイベントを発生させて
# から inputText する（対象欄は元々空文字のため、通常は入力値に影響しない）。
appId: com.recipi.app
---
- launchApp
# 起動後は splash → 未ログインなのでログイン画面に着地する。
# そこから「新規登録」リンクでサインアップ画面へ移動する。
- tapOn: "新規登録"
- tapOn:
    id: "signup-email"
- eraseText: 1
- inputText: "e2euser_001@example.com"
- tapOn:
    id: "signup-password"
- eraseText: 1
- inputText: "TestPass123!"
- tapOn:
    id: "signup-password-confirm"
- eraseText: 1
- inputText: "TestPass123!"
- tapOn:
    id: "signup-display-name"
- eraseText: 1
- inputText: "E2EUser A"
- tapOn:
    id: "signup-security-question"
- eraseText: 1
- inputText: "好きな食べ物は？"
- tapOn:
    id: "signup-security-answer"
# この欄への遷移だけ、何度検証しても直前の「秘密の質問」欄に文字が
# 連結される問題が再現した（デバッグスクリーンショットで確認）。
# tapOn を連続で行うことで、UI 階層を再取得させてから実際にフォーカスを
# 移す（Maestro のタップ取りこぼしに対する定番の回避策）。
- tapOn:
    id: "signup-security-answer"
- eraseText: 1
- inputText: "ラーメン"
# ソフトキーボードが開いたままだと画面下部の「登録」ボタンが隠れて
# タップできない（CI で "Element not found: signup-submit" になった原因）。
- hideKeyboard
# AOSP キーボードが「連絡先へのアクセスを許可しますか？」の権限ダイアログを
# 出すことがある（CI ワークフロー側で事前に許可しているが、念のための保険）。
# ダイアログが無ければ何もしない（optional）。
- tapOn:
    text: "ALLOW"
    optional: true
- tapOn:
    id: "signup-submit"

# 登録成功 → 自動ログイン状態でホーム（(app)/index.tsx）に遷移し、
# 表示名入りのウェルカムメッセージが出ることを確認する。
- extendedWaitUntil:
    visible: "ようこそ、E2EUser A さん"
    timeout: 15000

- tapOn:
    id: "home-logout"

# ログアウト後は認可ゲート（useProtectedRoute）によりログイン画面へ戻される。
- assertVisible:
    id: "login-email"

- tapOn:
    id: "login-email"
- eraseText: 1
- inputText: "e2euser_001@example.com"
- tapOn:
    id: "login-password"
- eraseText: 1
- inputText: "TestPass123!"
- hideKeyboard
- tapOn:
    id: "login-submit"

- extendedWaitUntil:
    visible: "ようこそ、E2EUser A さん"
    timeout: 15000

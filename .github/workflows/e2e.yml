# E2E テスト（Maestro）。
# infra/docker-compose.yml でバックエンド一式（postgres + minio + api）を
# 起動し、Android エミュレータ ＋ Web（Chromium）の 2 系統で
# signup → 自動ログイン確認 → logout → 再ログイン の一連を検証する。
# 方針・スコープ（iOS は対象外）は docs/requirements/testing.md §5, §7。

name: e2e

on:
  pull_request:
    branches: [main]
    paths:
      - "expoApp/**"
      - "backend/**"
      - "infra/**"
      - "openapi/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: .env.development を作る（テンプレートから。CI 用の値を追記して上書き）
        run: |
          cp .env.development.example .env.development
          {
            echo "POSTGRES_PASSWORD=ci-only-not-a-real-secret"
            echo "DATABASE_URL=postgresql+psycopg://recipi:ci-only-not-a-real-secret@localhost:5432/recipi"
            echo "JWT_SECRET_KEY=ci-only-not-a-real-secret"
            echo "MINIO_ROOT_USER=ci-test"
            echo "MINIO_ROOT_PASSWORD=ci-only-not-a-real-secret"
            echo "S3_ACCESS_KEY_ID=ci-test"
            echo "S3_SECRET_ACCESS_KEY=ci-only-not-a-real-secret"
            echo "CORS_ALLOW_ORIGINS=http://localhost:8081"
          } >> .env.development

      - name: バックエンド一式を起動（postgres + minio）
        run: docker compose --env-file ../.env.development -f docker-compose.yml up -d --wait postgres minio
        working-directory: infra

      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: バックエンドの依存をインストール
        run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: DB マイグレーションを適用
        run: alembic upgrade head
        working-directory: backend
        env:
          APP_ENV: development

      - name: api を起動
        run: docker compose --env-file ../.env.development -f docker-compose.yml up -d --build api
        working-directory: infra

      - name: api の起動を待つ（/healthz）
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "api did not become healthy in time" >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: expoApp/package-lock.json

      - name: 依存をインストール
        run: npm ci
        working-directory: expoApp

      - name: Web ビルド（バックエンドは localhost:8000 を指す）
        run: npm run build:web
        working-directory: expoApp
        env:
          EXPO_PUBLIC_API_BASE_URL: http://localhost:8000

      - name: 静的サーバーで配信
        run: npx serve -s dist -l 8081 &
        working-directory: expoApp

      - name: 静的サーバーの起動を待つ
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8081 > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "static server did not start in time" >&2
          exit 1

      - name: Maestro CLI をインストール
        uses: dniHze/maestro-test-action@v1
        with:
          version: "2.10.0"

      # Maestro の Web（Chromium）サポートはヘッドレス指定をせず素の Chrome を
      # 起動するため、ディスプレイの無い GitHub Actions ランナーでは
      # 「Chrome instance exited」で即座に失敗する。`--headless` フラグ自体は
      # あるが scroll 系コマンドが不安定になる既知の不具合があるため、
      # 代わりに Xvfb（仮想ディスプレイ）を使い、通常の（非ヘッドレス）
      # Chrome をそのまま動かす。
      - name: Xvfb をインストール
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Maestro フローを実行（Web / Chromium、Xvfb 上で）
        run: xvfb-run --auto-servernum maestro test .maestro/signup-login-logout.web.yaml -e E2E_WEB_BASE_URL=http://localhost:8081
        working-directory: expoApp

      - name: 後片付け
        if: always()
        run: docker compose --env-file ../.env.development -f docker-compose.yml down -v
        working-directory: infra

  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: .env.development を作る（テンプレートから。CI 用の値を追記して上書き）
        run: |
          cp .env.development.example .env.development
          {
            echo "POSTGRES_PASSWORD=ci-only-not-a-real-secret"
            echo "DATABASE_URL=postgresql+psycopg://recipi:ci-only-not-a-real-secret@localhost:5432/recipi"
            echo "JWT_SECRET_KEY=ci-only-not-a-real-secret"
            echo "MINIO_ROOT_USER=ci-test"
            echo "MINIO_ROOT_PASSWORD=ci-only-not-a-real-secret"
            echo "S3_ACCESS_KEY_ID=ci-test"
            echo "S3_SECRET_ACCESS_KEY=ci-only-not-a-real-secret"
            # Android エミュレータからホストへは 10.0.2.2 で到達する（environment.md）。
            echo "CORS_ALLOW_ORIGINS=http://10.0.2.2:8081"
          } >> .env.development

      - name: バックエンド一式を起動（postgres + minio）
        run: docker compose --env-file ../.env.development -f docker-compose.yml up -d --wait postgres minio
        working-directory: infra

      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: バックエンドの依存をインストール
        run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: DB マイグレーションを適用
        run: alembic upgrade head
        working-directory: backend
        env:
          APP_ENV: development

      - name: api を起動
        run: docker compose --env-file ../.env.development -f docker-compose.yml up -d --build api
        working-directory: infra

      - name: api の起動を待つ（/healthz）
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "api did not become healthy in time" >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: expoApp/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 依存をインストール
        run: npm ci
        working-directory: expoApp

      - name: Android ネイティブプロジェクトを生成（expo prebuild）
        run: npx expo prebuild --platform android --non-interactive
        working-directory: expoApp
        env:
          # エミュレータからホストの api コンテナへは 10.0.2.2 で到達する。
          EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:8000

      # Android 9 (API 28) 以降は平文（HTTP）通信がデフォルトで禁止されるため、
      # このままだと signup 等のリクエストがすべて失敗する。本番の app.json は
      # 変更せず（本番は HTTPS 前提）、E2E 用に生成された使い捨てのネイティブ
      # プロジェクトの AndroidManifest.xml にだけ属性を追記する。
      - name: E2E 用に限り平文通信を許可する
        run: |
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' \
            android/app/src/main/AndroidManifest.xml
        working-directory: expoApp

      # release variant にすることで JS バンドルを APK に同梱する
      # （debug variant は Metro 経由でバンドルを取得する前提のため、
      # エミュレータ単体では起動できない）。JS バンドル自体はこのステップの
      # gradle タスクの中で行われる（EXPO_PUBLIC_ 変数はバンドル時に埋め込まれる
      # ため、prebuild だけでなくここにも同じ値を渡す必要がある）。
      - name: APK をビルド（release variant）
        run: ./gradlew assembleRelease
        working-directory: expoApp/android
        env:
          EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:8000

      - name: KVM を有効化（エミュレータのハードウェアアクセラレーション用）
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Maestro CLI をインストール
        uses: dniHze/maestro-test-action@v1
        with:
          version: "2.10.0"

      - name: エミュレータを起動し、Maestro フローを実行（Android）
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r expoApp/android/app/build/outputs/apk/release/app-release.apk
            maestro test expoApp/.maestro/signup-login-logout.yaml

      - name: 後片付け
        if: always()
        run: docker compose --env-file ../.env.development -f docker-compose.yml down -v
        working-directory: infra

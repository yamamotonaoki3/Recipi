# 契約テスト。
# 1) FastAPI から openapi.json を作り直して、コミット済みと一致するか確認
# 2) その openapi.json からフロントの型（expoApp/src/api/schema.ts）を
#    作り直して、コミット済みと一致するか確認
# 差分が出る = API を変えたのに生成物を更新し忘れている。
# 方針は docs/requirements/testing.md §1・§5。

name: contract

on:
  push:
    paths:
      - "backend/**"
      - "expoApp/**"
      - "openapi/**"
      - ".github/workflows/contract.yml"
  # PR では paths で絞らない（必須チェックが「待ち」で詰まらないように）。
  # 関係ない変更かどうかは下の changes ジョブで判定する（Issue #87）。
  pull_request:
    branches: [main]

jobs:
  # PR の変更ファイルを見て、本体のジョブを走らせるかを決める（Issue #87）。
  # 本体を条件でスキップすると、必須チェックは「成功」扱いになる（docs だけの
  # PR でも待ちのまま詰まらない）。判定自体が失敗したら本体は全部走らせる。
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: 変更ファイルを判定
        id: changes
        run: bash scripts/ci/changed.sh '^(backend/|expoApp/|openapi/)'
        env:
          EVENT_NAME: ${{ github.event_name }}

  openapi-in-sync:
    needs: changes
    # 判定が「対象の変更なし」のときだけ飛ばす。判定が失敗・未完了なら安全側で走らせる。
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 実行時依存をインストール
        run: pip install -r requirements.txt

      - name: openapi.json を再生成
        # export_openapi.py はスクリプト位置からリポジトリルートの openapi/ に書く
        # ので、working-directory がどこでも出力先は同じ。
        run: python -m scripts.export_openapi

      - name: コミット済みと差分が無いか確認
        working-directory: ${{ github.workspace }} # リポジトリルートで git を実行
        run: |
          if ! git diff --exit-code -- openapi/openapi.json; then
            echo "::error::openapi/openapi.json がコードと一致しません。backend/ で 'python -m scripts.export_openapi' を実行してコミットしてください。"
            exit 1
          fi

  schema-ts-in-sync:
    needs: changes
    # 判定が「対象の変更なし」のときだけ飛ばす。判定が失敗・未完了なら安全側で走らせる。
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expoApp

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: expoApp/package-lock.json

      - name: 依存をインストール
        run: npm ci

      - name: schema.ts を再生成
        run: npm run gen:api

      - name: コミット済みと差分が無いか確認
        working-directory: ${{ github.workspace }}
        run: |
          if ! git diff --exit-code -- expoApp/src/api/schema.ts; then
            echo "::error::expoApp/src/api/schema.ts が openapi.json と一致しません。expoApp/ で 'npm run gen:api' を実行してコミットしてください。"
            exit 1
          fi

# 契約テスト（Phase 0 版）。
# FastAPI から openapi.json を作り直して、コミット済みと一致するか確認する。
# 差分が出る = API を変えたのに openapi/openapi.json を更新し忘れている。
#
# フロント（expoApp）の生成物 schema.ts の diff チェックは #34 で追加する。
# 方針は docs/requirements/testing.md §1・§5。

name: contract

on:
  push:
    paths:
      - "backend/**"
      - "openapi/**"
      - ".github/workflows/contract.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "openapi/**"
      - ".github/workflows/contract.yml"

jobs:
  openapi-in-sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 実行時依存をインストール
        run: pip install -r requirements.txt

      - name: openapi.json を再生成
        # export_openapi.py はスクリプト位置からリポジトリルートの openapi/ に書く
        # ので、working-directory がどこでも出力先は同じ。
        run: python -m scripts.export_openapi

      - name: コミット済みと差分が無いか確認
        working-directory: ${{ github.workspace }}   # リポジトリルートで git を実行
        run: |
          if ! git diff --exit-code -- openapi/openapi.json; then
            echo "::error::openapi/openapi.json がコードと一致しません。backend/ で 'python -m scripts.export_openapi' を実行してコミットしてください。"
            exit 1
          fi

# フロントエンド（expoApp / TypeScript）の CI。
# 品質チェック（ESLint / Prettier / tsc）→ jest（単体・結合）→ Web ビルド。
# 時間のかかる Tauri 検証は tauri.yml から手動実行する。
# 方針は docs/requirements/testing.md。

name: frontend-ts

on:
  push:
    paths:
      - "expoApp/**"
      - "openapi/**"
      - ".github/workflows/frontend-ts.yml"
  pull_request:
    branches: [main]
    paths:
      - "expoApp/**"
      - "openapi/**"
      - ".github/workflows/frontend-ts.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expoApp

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: expoApp/package-lock.json

      - name: 依存をインストール
        run: npm ci

      - name: 品質チェック（ESLint）
        run: npm run lint

      - name: 品質チェック（Prettier）
        run: npm run format

      - name: 品質チェック（tsc 型チェック）
        run: npm run typecheck

      - name: テスト（jest・行/分岐カバレッジ）
        run: npm test -- --coverage

      - name: Web ビルド（Tauri デスクトップの中身 ＋ ビルド検証）
        run: npm run build:web

# バックエンドの CI。
# 品質チェック（ruff / mypy）→ マイグレーション適用 → pytest（単体 ＋ 結合）
# を実行する。結合テストは本物の PostgreSQL（service コンテナ）に対して走る。
# 方針は docs/requirements/testing.md。

name: backend

on:
  push:
    paths:
      - "backend/**"
      - "openapi/**"
      - ".github/workflows/backend.yml"
  # PR では paths で絞らない（必須チェックが「待ち」で詰まらないように）。
  # 関係ない変更かどうかは下の changes ジョブで判定する（Issue #87）。
  pull_request:
    branches: [main]

jobs:
  # PR の変更ファイルを見て、本体のジョブを走らせるかを決める（Issue #87）。
  # 本体を条件でスキップすると、必須チェックは「成功」扱いになる（docs だけの
  # PR でも待ちのまま詰まらない）。判定自体が失敗したら本体は全部走らせる。
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: 変更ファイルを判定
        id: changes
        run: bash scripts/ci/changed.sh '^(backend/|openapi/)'
        env:
          EVENT_NAME: ${{ github.event_name }}

  test:
    needs: changes
    # 判定が「対象の変更なし」のときだけ飛ばす。判定が失敗・未完了なら安全側で走らせる。
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    # PR にカバレッジをコメントするため、このジョブだけ PR への書き込みを許可する（Issue #86）。
    permissions:
      contents: read
      pull-requests: write
    env:
      # カバレッジの下限（testing.md §3）。下限判定とコメントで同じ値を使う。
      COVERAGE_MIN_LINES: "85"
      COVERAGE_MIN_BRANCHES: "75"
    defaults:
      run:
        working-directory: backend

    services:
      # 結合テスト用の使い捨て PostgreSQL。ジョブが終われば破棄される。
      # MinIO（ストレージ）は `services:` では起動できないので下のステップで
      # docker run する（`services:` はコンテナの command を上書きできず、
      # MinIO は `server /data` の引数が必須のため。lessons-learned 2026-09-04 #7）。
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: recipi_test
          POSTGRES_USER: recipi_test
          POSTGRES_PASSWORD: recipi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recipi_test -d recipi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 依存をインストール
        run: pip install -r requirements-dev.txt

      - name: .env.test を作る（テンプレートから。CI 用の値を追記して上書き）
        run: |
          cp ../.env.test.example ../.env.test
          # .env は同じキーが複数あると「後の行」が勝つ。CI 用の実値を末尾に足す。
          {
            echo "DATABASE_URL=postgresql+psycopg://recipi_test:recipi_test@localhost:5432/recipi_test"
            echo "JWT_SECRET_KEY=ci-only-not-a-real-secret"
            # 下で起動する MinIO のルート資格情報と必ず一致させること。
            # ずれると PutObject が InvalidAccessKeyId で落ちる。
            echo "S3_ACCESS_KEY_ID=ci-minio-user"
            echo "S3_SECRET_ACCESS_KEY=ci-only-not-a-real-secret"
            echo "AI_PROVIDER=stub"
            echo "LOG_LEVEL=WARNING"
          } >> ../.env.test

      # 画像アップロードの結合テスト用ストレージ（Issue #39）。
      # `services:` ではなく docker run にしている理由は上のコメント参照。
      # バケットの作成と公開設定はテスト側（conftest の ensure_bucket）が行う。
      - name: MinIO を起動（結合テストのストレージ）
        run: |
          # MinIO のイメージには mc クライアントが入っていないため、HTTP エンドポイントで確認する。
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=ci-minio-user \
            -e MINIO_ROOT_PASSWORD=ci-only-not-a-real-secret \
            --health-cmd "curl -fsS http://localhost:9000/minio/health/live" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 20 \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' minio)" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          echo "MinIO did not become healthy in time" >&2
          docker logs minio
          exit 1

      - name: 品質チェック（ruff lint）
        run: ruff check .

      - name: 品質チェック（ruff format）
        run: ruff format --check .

      - name: 品質チェック（mypy 型チェック）
        run: mypy .

      - name: DB マイグレーションを適用
        run: alembic upgrade head
        env:
          APP_ENV: test

      - name: pytest（単体 ＋ 結合、行・分岐カバレッジ）
        id: pytest
        # coverage.json は下の下限判定と PR コメントで使う。
        run: pytest --cov-report=json
        env:
          APP_ENV: test

      - name: カバレッジの下限を判定（行・分岐を別々に）
        # `--cov-fail-under` は行と分岐の合算しか見ないので、行と分岐をそれぞれ下限と
        # 比べるスクリプトで判定する（testing.md §3。MVP 目標値。Issue #76）。
        run: python -m scripts.check_coverage coverage.json --lines "$COVERAGE_MIN_LINES" --branches "$COVERAGE_MIN_BRANCHES"

      # --- PR にカバレッジをコメント（Issue #86） ---------------------------
      # 下限を割って上のステップが失敗したときこそ見えてほしいので always() で走らせる
      # （pytest 自体が走らなかったときは出さない）。フォークの PR はトークンが
      # 読み取り専用で書けないので出さない。コメントは補助なので、失敗しても
      # CI は落とさない（continue-on-error。合否は上の下限判定だけで決まる）。
      - name: カバレッジのコメント本文を作る
        id: coverage_comment
        if: >-
          always() && github.event_name == 'pull_request' &&
          steps.pytest.outcome != 'skipped' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # 変更ファイルは GitHub の API から取る（checkout の形に依存しない）。削除は除く。
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files"             --jq '.[] | select(.status != "removed") | .filename' > changed-files.txt
          python -m scripts.coverage_comment coverage.json             --changed-files changed-files.txt             --lines "$COVERAGE_MIN_LINES" --branches "$COVERAGE_MIN_BRANCHES"             --output coverage-comment.md

      - name: PR にカバレッジをコメント（あれば更新）
        if: always() && steps.coverage_comment.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # 目印を含み、かつ github-actions[bot] が書いたコメントだけを更新対象にする
          # （他人が同じ目印を書いても触らない）。無ければ新しく書く。
          marker='<!-- recipi-coverage:backend -->'
          id=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments"             --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .id"             | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@coverage-comment.md > /dev/null
            echo "既存のコメント（$id）を更新しました"
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@coverage-comment.md > /dev/null
            echo "コメントを新しく書きました"
          fi

# バックエンドの CI。
# 品質チェック（ruff / mypy）→ マイグレーション適用 → pytest（単体 ＋ 結合）
# を実行する。結合テストは本物の PostgreSQL（service コンテナ）に対して走る。
# 方針は docs/requirements/testing.md。

name: backend

on:
  push:
    paths:
      - "backend/**"
      - "openapi/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "openapi/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # 結合テスト用の使い捨て PostgreSQL。ジョブが終われば破棄される。
      # MinIO（ストレージ）は `services:` では起動できないので下のステップで
      # docker run する（`services:` はコンテナの command を上書きできず、
      # MinIO は `server /data` の引数が必須のため。lessons-learned 2026-09-04 #7）。
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: recipi_test
          POSTGRES_USER: recipi_test
          POSTGRES_PASSWORD: recipi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recipi_test -d recipi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 依存をインストール
        run: pip install -r requirements-dev.txt

      - name: .env.test を作る（テンプレートから。CI 用の値を追記して上書き）
        run: |
          cp ../.env.test.example ../.env.test
          # .env は同じキーが複数あると「後の行」が勝つ。CI 用の実値を末尾に足す。
          {
            echo "DATABASE_URL=postgresql+psycopg://recipi_test:recipi_test@localhost:5432/recipi_test"
            echo "JWT_SECRET_KEY=ci-only-not-a-real-secret"
            # 下で起動する MinIO のルート資格情報と必ず一致させること。
            # ずれると PutObject が InvalidAccessKeyId で落ちる。
            echo "S3_ACCESS_KEY_ID=ci-minio-user"
            echo "S3_SECRET_ACCESS_KEY=ci-only-not-a-real-secret"
            echo "AI_PROVIDER=stub"
            echo "LOG_LEVEL=WARNING"
          } >> ../.env.test

      # 画像アップロードの結合テスト用ストレージ（Issue #39）。
      # `services:` ではなく docker run にしている理由は上のコメント参照。
      # バケットの作成と公開設定はテスト側（conftest の ensure_bucket）が行う。
      - name: MinIO を起動（結合テストのストレージ）
        run: |
          # MinIO のイメージには mc クライアントが入っていないため、HTTP エンドポイントで確認する。
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=ci-minio-user \
            -e MINIO_ROOT_PASSWORD=ci-only-not-a-real-secret \
            --health-cmd "curl -fsS http://localhost:9000/minio/health/live" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 20 \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' minio)" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          echo "MinIO did not become healthy in time" >&2
          docker logs minio
          exit 1

      - name: 品質チェック（ruff lint）
        run: ruff check .

      - name: 品質チェック（ruff format）
        run: ruff format --check .

      - name: 品質チェック（mypy 型チェック）
        run: mypy .

      - name: DB マイグレーションを適用
        run: alembic upgrade head
        env:
          APP_ENV: test

      - name: pytest（単体 ＋ 結合、行・分岐カバレッジ）
        # coverage.xml は PR コメント用（投稿は未実装・Issue #86）、coverage.json は下の判定用。
        run: pytest --cov-report=xml --cov-report=json
        env:
          APP_ENV: test

      - name: カバレッジの下限を判定（行・分岐を別々に）
        # `--cov-fail-under` は行と分岐の合算しか見ないので、行と分岐をそれぞれ下限と
        # 比べるスクリプトで判定する（testing.md §3。MVP 目標値。Issue #76）。
        run: python -m scripts.check_coverage coverage.json --lines 85 --branches 75

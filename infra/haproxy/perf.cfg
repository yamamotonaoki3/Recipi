global
  log stdout format raw local0

defaults
  mode http
  timeout connect 5s
  timeout client 60s
  timeout server 60s

frontend perf_in
  bind *:8000
  default_backend api_pool

backend api_pool
  balance roundrobin
  option httpchk GET /healthz
  server-template api 4 api:8000 check resolvers docker init-addr libc,none

resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 10s

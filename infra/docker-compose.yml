# ローカル開発用のインフラ定義。
#
# 標準の開発フロー（architecture.md / environment.md §4）:
#   docker compose --env-file ../.env.development -f docker-compose.yml up -d postgres minio
#   → DB とストレージだけ起動し、バックエンドは `uvicorn --reload` でホスト実行。
#
# `api` サービスはフルスタック実行・E2E 用。
#
# 値はすべて ${VAR} 参照（実値は書かない）。${VAR} 展開のために
# `--env-file` が必要（compose は .env.<環境> を自動では読まない）。

name: recipi

services:
  postgres:
    image: postgres:18                       # メジャーバージョンを固定（todo #5）
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"                           # ホストからも接続できるように公開
    volumes:
      # PostgreSQL 18+ は /var/lib/postgresql（親ディレクトリ）をマウントする
      # 構成が推奨（データはバージョン別サブディレクトリに置かれる）。
      - postgres_data:/var/lib/postgresql
      # 初回起動時にテスト用 DB（recipi_test）も作る
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:                              # 起動完了を待てるようにする
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest                # S3 互換ストレージ（画像保存）
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"                           # S3 API
      - "9001:9001"                           # 管理コンソール（http://localhost:9001）
    volumes:
      - minio_data:/data
    healthcheck:
      # MinIO の HTTP ヘルスエンドポイント（mc クライアントはこのイメージに無い）
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    # フルスタック実行・E2E 用。標準の開発では起動しない。
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../.env.development                   # env_file のパスは compose ファイルからの相対
    environment:
      # コンテナ内からは「サービス名」で他コンテナに繋ぐ（localhost ではない）。
      # .env.development の値をここで上書きする（environment.md §4）。
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
